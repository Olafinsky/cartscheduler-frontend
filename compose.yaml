services:
  frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: cartscheduler-frontend-dev
    container_name: cartscheduler-frontend-dev
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://host.docker.internal:8080
      VITE_USE_POLLING: "true"
      VITE_HMR_CLIENT_PORT: "5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

  frontend-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: cartscheduler-frontend
    container_name: cartscheduler-frontend
    ports:
      - "3000:80"
    environment:
      BACKEND_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  frontend_node_modules:
